name: Label upstream-candidate (PF.5 / FR-F21)
on:
  issues:
    types: [opened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Apply upstream-candidate when triage says reproduces upstream
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const yes =
              /Yes — reproduces in stock VS Code/i.test(body) ||
              /Yes — reproduces in VSCodium/i.test(body) ||
              /\[[xX]\] Yes — reproduces in stock VS Code/i.test(body) ||
              /\[[xX]\] Yes — reproduces in VSCodium/i.test(body);
            if (!yes) {
              core.info('No upstream reproduction checked — skip');
              return;
            }
            const label = 'upstream-candidate';
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [label],
              });
            } catch (e) {
              core.warning(`Could not add label (create '${label}' in repo settings): ${e.message}`);
            }
