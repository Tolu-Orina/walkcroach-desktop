name: Package matrix (PE.1)
# Structural packaging CI. Full gulp package needs nested vscode/ + disk on runner.
# Unsigned Windows portable: docs/SHIPPING.md + release-windows-portable.yml
# Signed release jobs are gated on secrets (never claim signed without certs).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel'
        required: true
        default: 'insiders'
        type: choice
        options: [insiders, stable]
  push:
    tags: ['desktop-v*']

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    name: Structural package gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Desktop product
        run: npm run verify:fast
      - name: Release notes templates present
        run: |
          test -f packaging/RELEASE_NOTES.TEMPLATE.md
          test -f packaging/RELEASE_NOTES.preview.md
      - name: macOS entitlements present
        run: test -f packaging/entitlements.mac.plist
      - name: Packaging scripts present
        run: |
          test -f scripts/package-windows-portable.mjs
          test -f scripts/package-engine-bundle.mjs
          test -f packages/desktop-agent/scripts/bundle-engine.mjs

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    needs: structural
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record packaging intent
        shell: bash
        run: |
          echo "channel=${{ github.event.inputs.channel || 'insiders' }}"
          echo "os=${{ matrix.os }}"
          echo "Full vscode npm ci + gulp vscode-win32-x64 deferred until nested vscode is CI-available."
          echo "Local: npm run package:windows-portable"
          echo "See docs/SHIPPING.md"

  signed-release:
    name: Signed release (secrets required)
    needs: structural
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Enable when signing is funded — see docs/SHIPPING.md"
